name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible and lint tools
        run: pip install ansible ansible-lint yamllint

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: YAML lint
        run: yamllint .

      - name: Ansible lint
        run: ansible-lint playbook.yml

      - name: Syntax check
        run: ansible-playbook begin.yml --syntax-check -i host.yml
