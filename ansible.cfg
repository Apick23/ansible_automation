[defaults]
# Use local hosts file inside the Ansible folder
inventory = ./inventory/hosts.yml

# Don't worry about RSA fingerprints
host_key_checking = False

# Do not create retry files on the jobs the fail
retry_files_enabled = False

# Do not gather facts
gather = explicit

#Define Python Interpeter for Ansible 2.8 and above
interpreter_python = /usr/bin/python3
